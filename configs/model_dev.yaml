# MODULE 1 — Model Development (Home Credit)
# Định nghĩa target, population: xem definitions.yaml -> home_credit.

seed: 42
population: application_train

# Home Credit không có ngày nộp đơn -> stratified random split, gán một lần,
# lưu lại theo SK_ID_CURR để scorecard và LightGBM dùng đúng cùng population.
split:
  method: stratified_random
  id_column: SK_ID_CURR
  stratify_on: TARGET
  fractions:
    train: 0.60        # fit binning, WoE, scorecard, LightGBM
    validation: 0.10   # early stopping, chọn biến, so sánh cấu hình
    calibration: 0.15  # chỉ để fit Platt / isotonic
    test: 0.15         # chỉ đánh giá cuối, không dùng để ra quyết định trong lúc phát triển

binning:
  initial_quantile_bins: 20
  max_bins: 8
  min_bin_share: 0.05
  prefer_monotonic_trend: true
  missing_as_own_bin: true
  rare_category_share: 0.01
  # Fit đơn điệu giữ lại dưới tỷ lệ IV này so với 20 pre-bin thì bị gắn cờ để xem lại.
  review_iv_retention: 0.60
  # Ngoại lệ cho prefer_monotonic_trend: biến -> lý do nghiệp vụ (bắt buộc).
  # Chỉ thêm khi hình dạng không đơn điệu có giải thích nghiệp vụ, không phải để tăng IV.
  allow_non_monotonic:
    AMT_CREDIT: >-
      Chữ U ngược: bad rate theo decile trên train 6.6% -> 10.5% -> 5.4%, và vẫn giữ khi
      chỉ xét Cash loans (6.4% -> 10.9% -> 5.5%), nên không chỉ do cơ cấu sản phẩm.
      Khoản lớn chỉ được duyệt cho khách tốt hơn (thu nhập TB 116k -> 246k, EXT_SOURCE_2
      0.48 -> 0.57): hiệu ứng chính sách duyệt vay. Kiểm độ ổn định ở 2.5 và tương quan
      với thu nhập / EXT_SOURCE ở 2.6. (2026-09-22)
    AMT_ANNUITY: >-
      Cùng hình dạng và cùng cơ chế với AMT_CREDIT: 7.2% -> 10.1% -> 6.0% trên train,
      chỉ Cash loans 7.0% -> 10.3% -> 6.1%; thu nhập TB 115k -> 264k theo decile.
      (2026-09-22)
    # AMT_GOODS_PRICE KHÔNG đưa vào: "đỉnh" rủi ro là một giá trị tròn duy nhất
    # (đúng 450,000: 15,613 hồ sơ train, bad rate 13.5%, lân cận 400k-500k chỉ 7.6%).
    # Đó là một sản phẩm / chiến dịch, không phải quan hệ giá hàng - rủi ro.

feature_selection:
  iv_min: 0.02                  # tham chiếu definitions.metric_thresholds.iv
  # Stage 2.5 - kiểm tra ngoài mẫu: bin học trên train, chỉ đếm lại trên validation.
  min_iv_retention_validation: 0.50   # IV validation / IV train dưới mức này -> cờ iv_drops_out_of_sample
  min_bad_rate_rank_corr: 0.80        # tương quan hạng bad rate giữa các bin, train vs validation
  # Stage 2.6 - chọn biến. Thứ tự: policy -> IV -> cờ 2.5 -> tương quan WoE -> VIF.
  max_abs_correlation: 0.70           # |r| giữa WoE của hai biến; giữ biến có IV cao hơn
  max_abs_rank_correlation_raw: 0.90  # |Spearman| trên giá trị gốc: hai cách đo cùng một đại lượng
  max_vif: 5.0
  # Cờ của 2.5 làm biến bị loại (weak đã do iv_min lo; binning_review chỉ là cờ xem lại).
  drop_on_flags: [leakage_suspect, iv_drops_out_of_sample, trend_not_confirmed, unstable_vs_validation, shift_vs_current]
  # Biến bị loại vì chính sách, không vì thống kê: biến -> lý do (bắt buộc).
  # QUYẾT ĐỊNH 2026-09-22 (PROJECT_SCOPE #7): để trống có chủ đích. CODE_GENDER,
  # NAME_FAMILY_STATUS và DAYS_BIRTH được chọn theo tiêu chí thống kê như mọi biến khác.
  # Hệ quả bắt buộc: model card ghi rủi ro fairness; Module 2 phân tích hiệu năng theo
  # ba phân khúc này (validation.yaml -> segments, fairness_review).
  policy_exclude: {}
  require_stable_coefficient_sign: true

champion:
  model: woe_logistic_scorecard
  regularization: l2
  # C = 1 là phạt L2 nhẹ: với ~185k hồ sơ train, C 1 / 0.01 cho AUC validation như nhau
  # (0.7582 / 0.7584, 45 biến); C 0.001 bắt đầu mất AUC. Giữ 1 để hệ số gần MLE.
  C: 1.0
  # Hệ số trên WoE phải âm (feature_selection.require_stable_coefficient_sign). Mỗi vòng
  # fit lại trên bootstrap phân tầng của train; biến âm trong dưới min_share số lần bị
  # loại, mỗi vòng một biến, rồi fit lại.
  sign_stability:
    bootstrap_resamples: 50
    min_share: 0.95

challenger:
  model: lightgbm
  # Đầu vào: mọi biến của bảng feature Stage 2.3 (đã qua availability matrix), giá trị gốc.
  early_stopping_rounds: 100    # trên AUC validation
  max_trials: 30                # không gian tham số nhỏ, mọi cấu hình đều được log
  num_boost_round: 5000         # trần; early stopping dừng sớm hơn nhiều
  learning_rate: 0.05
  # Chọn cấu hình: các trial có AUC validation cách trial tốt nhất <= mức này coi như bằng nhau
  # (sai số chuẩn của AUC trên ~30k hồ sơ validation cỡ 0.003); trong nhóm đó lấy trial ít
  # overfit nhất (chênh AUC train - validation nhỏ nhất). Lần chạy đầu: trial tốt nhất chỉ hơn
  # trial thứ hai 0.0004 AUC nhưng dùng 1295 cây và chênh train - validation 0.094 so với 0.065.
  selection_tolerance_auc: 0.001
  # Cố định số luồng: cùng dữ liệu và cấu hình cho cùng cây trên mọi máy (deterministic).
  num_threads: 4
  # Lưới nhỏ; max_trials cấu hình được lấy ngẫu nhiên theo seed, không lặp lại.
  search_space:
    num_leaves: [15, 31, 63]
    min_child_samples: [50, 100, 200, 400]
    feature_fraction: [0.5, 0.7, 0.9]
    bagging_fraction: [0.7, 0.8, 1.0]
    bagging_freq: [1]
    lambda_l2: [0.0, 1.0, 10.0]

calibration:
  methods: [platt, isotonic]
  n_bins_for_diagnostics: 10

explainability:
  reason_codes_per_applicant: 4
  shap_waterfall_examples: 5
