# DATA CONTRACT + DATA DICTIONARY — Freddie Mac Single-Family Loan-Level Dataset (sample)
#
# Nguồn: General User Guide + File Layout, bản áp dụng từ July 2026 (Release 47).
# File pipe-delimited, KHÔNG có header -> thứ tự cột dưới đây phải khớp tuyệt đối
# với layout. Ingest dừng ngay nếu số cột trong file khác số cột khai báo.
#
# Khác Home Credit: với Freddie, na_values là mã "Not Available" thuần tuý
# (9999, 999, 99, 9, XX...), được đổi thành NULL ngay khi ingest.
# dtype yyyymm -> DATE (ngày 01 của tháng).
# Các quy ước còn lại (nullable, allowed_values, min/max, severity): xem home_credit.yaml.

source: freddie_mac
raw_subdir: freddie_mac
format: pipe_no_header
layout_version: "2026-07"

tables:
  origination:
    file_glob: "sample_orig_*.txt"
    description: "Thuộc tính lúc giải ngân. Một dòng = một khoản vay."
    primary_key: [loan_id]
    min_rows: 1
    columns:
      - {name: fico, dtype: integer, na_values: ["9999"], min: 300, max: 850, severity: warn, description: "Classic FICO"}
      - {name: first_payment_date, dtype: yyyymm, nullable: false}
      - {name: first_time_homebuyer, dtype: string, na_values: ["9"], allowed_values: [Y, N], severity: warn}
      - {name: maturity_date, dtype: yyyymm}
      - {name: msa, dtype: string, description: "MSA / Metropolitan Division; NULL = không thuộc MSA hoặc không rõ"}
      - {name: mi_pct, dtype: integer, na_values: ["999"], min: 0, max: 55, severity: warn}
      - {name: num_units, dtype: integer, na_values: ["99"], min: 1, max: 4, severity: warn}
      - {name: occupancy_status, dtype: string, na_values: ["9"], allowed_values: [P, I, S], severity: warn}
      - {name: orig_cltv, dtype: integer, na_values: ["999"], min: 1, max: 998, severity: warn}
      - {name: orig_dti, dtype: integer, na_values: ["999"], min: 0, max: 65, severity: warn}
      - {name: orig_upb, dtype: number, nullable: false, min: 0, severity: warn}
      - {name: orig_ltv, dtype: integer, na_values: ["999"], min: 1, max: 998, severity: warn}
      - {name: orig_interest_rate, dtype: number, min: 0, severity: warn}
      - {name: channel, dtype: string, na_values: ["9"], allowed_values: [R, B, C, T], severity: warn}
      - {name: prepayment_penalty, dtype: string, allowed_values: [Y, N], severity: warn}
      - {name: amortization_type, dtype: string, allowed_values: [FRM, ARM], severity: warn}
      - {name: property_state, dtype: string}
      - {name: property_type, dtype: string, na_values: ["99"], allowed_values: [CP, CO, PU, SF, MH], severity: warn}
      - {name: postal_code, dtype: string, na_values: ["000"], description: "3 chữ số đầu"}
      - {name: loan_id, dtype: string, role: key, nullable: false, description: "PYYQnXXXXXXX"}
      - {name: loan_purpose, dtype: string, na_values: ["9"], allowed_values: [P, C, N, R], severity: warn}
      - {name: orig_loan_term, dtype: integer}
      - {name: num_borrowers, dtype: integer, na_values: ["99"], min: 1, max: 10, severity: warn}
      - {name: seller_name, dtype: string}
      - {name: super_conforming_flag, dtype: string}
      - {name: pre_harp_loan_id, dtype: string}
      - {name: special_eligibility_program, dtype: string}
      - {name: harp_indicator, dtype: string}
      - {name: property_valuation_method, dtype: string, na_values: ["7"], allowed_values: ["1", "2", "3", "4"], severity: warn}
      - {name: interest_only_indicator, dtype: string}
      - {name: vantagescore4, dtype: integer, na_values: ["9999"], min: 300, max: 850, severity: warn}

  performance:
    file_glob: "sample_perf_*.txt"
    description: "Hiệu quả trả nợ hằng tháng. Một dòng = một cặp khoản vay - tháng báo cáo."
    primary_key: [loan_id, period]
    min_rows: 1
    foreign_keys:
      - {column: loan_id, references: [origination.loan_id], severity: warn}
    columns:
      - {name: loan_id, dtype: string, role: key, nullable: false}
      - {name: period, dtype: yyyymm, role: reporting_month, nullable: false}
      - {name: current_upb, dtype: number, min: 0, severity: warn}
      - {name: delinquency_status, dtype: string, na_values: ["XX"], pattern: "^([0-9]{2}|RA)$", severity: warn, description: "00 current, 01 30-59, 02 60-89, 03+ 90+, RA REO acquisition"}
      - {name: loan_age, dtype: integer}
      - {name: remaining_months_to_maturity, dtype: integer}
      - {name: defect_settlement_date, dtype: yyyymm}
      - {name: modification_flag, dtype: string, allowed_values: [Y, P], severity: warn}
      - {name: zero_balance_code, dtype: string, allowed_values: ["01", "02", "03", "09", "15", "16", "96"], severity: warn}
      - {name: zero_balance_effective_date, dtype: yyyymm}
      - {name: current_interest_rate, dtype: number}
      - {name: current_non_interest_bearing_upb, dtype: number}
      - {name: ddlpi, dtype: yyyymm, description: "Due date of last paid installment"}
      - {name: mi_recoveries, dtype: number}
      - {name: net_sales_proceeds, dtype: string, description: "Số tiền, hoặc mã chữ"}
      - {name: non_mi_recoveries, dtype: number}
      - {name: total_expenses, dtype: number}
      - {name: legal_costs, dtype: number}
      - {name: maintenance_preservation_costs, dtype: number}
      - {name: taxes_insurance, dtype: number}
      - {name: miscellaneous_expenses, dtype: number}
      - {name: actual_loss, dtype: number}
      - {name: cumulative_modification_costs, dtype: number}
      - {name: interest_rate_step_indicator, dtype: string}
      - {name: payment_deferral_flag, dtype: string, allowed_values: [C, P], severity: warn}
      - {name: eltv, dtype: integer, na_values: ["999"], min: 1, max: 998, severity: warn}
      - {name: zero_balance_removal_upb, dtype: number}
      - {name: delinquent_accrued_interest, dtype: number}
      - {name: delinquency_due_to_disaster, dtype: string, allowed_values: [Y], severity: warn}
      - {name: borrower_assistance_plan, dtype: string, allowed_values: [F, R, T], severity: warn}
      - {name: current_period_modification_costs, dtype: number}
      - {name: current_interest_bearing_upb, dtype: number}
      - {name: mi_cancellation_indicator, dtype: string, na_values: ["7"], allowed_values: [Y, N], severity: warn}
      - {name: servicer_name, dtype: string}
      - {name: bankruptcy_cramdown_costs, dtype: number}
