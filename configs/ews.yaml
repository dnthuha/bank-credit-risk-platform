# MODULE 3 — Portfolio Monitoring & Early Warning (Freddie Mac sample)
# Định nghĩa bucket, default, cửa sổ, COVID: xem definitions.yaml.

seed: 7

data:
  # Lứa 2012-2019: nguồn của mẫu train / validation (theo tháng quan sát, xem time_split).
  # Lứa 2020-2025: chỉ xuất hiện từ 2020, tức trong stress / out-of-time / monitoring,
  # để danh mục lúc test có cả khoản mới giải ngân như danh mục thật.
  vintage_years: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019,
                  2020, 2021, 2022, 2023, 2024, 2025]

monitoring:
  reporting_month: null   # "YYYY-MM"; null = tháng mới nhất có trong dữ liệu
  vintage_granularity: quarter
  delinquency_rates: [dpd30, dpd60, dpd90plus]
  concentration_dimensions: [fico_band, ltv_band, dti_band, property_state, vintage, channel]
  # Quyết định 2026-10-25 (chặng 8): mọi tỷ lệ báo cáo cả theo số khoản và theo dư nợ (current_upb).
  weights: [count, upb]
  vintage_curve:
    # Static pool chỉ gồm khoản có lịch sử từ đầu: dòng performance đầu tiên có loan_age <= 1.
    # Khoản bị cắt trái (vào panel muộn hơn) bị loại khỏi curve và được đếm trong báo cáo;
    # delayed entry để dành cho survival (chặng 9).
    max_first_loan_age: 1
    # Curve dừng ở MOB mà ít nhất tỷ lệ này của pool đã có thể đạt tới tính đến tháng cuối của panel.
    # Không dùng "mọi khoản" (= 1.0): dưới 0.1% khoản mỗi lứa có loan_age 0 muộn hơn quý trong
    # loan_id hàng năm trời và sẽ cắt cụt curve. Với 0.99, phần đuôi bị kéo thấp tối đa 1% tương đối.
    min_reach_share: 0.99
  # Số khoản lấy mẫu (seed ở đầu file) để đối chiếu migration tháng báo cáo với transitions.py (pandas).
  reference_sample_loans: 20000
  # Band phân khúc, cận hai đầu đều tính vào band; giá trị thiếu -> "missing".
  bands:
    fico:
      - {label: "<620",    max: 619}
      - {label: "620-679", min: 620, max: 679}
      - {label: "680-739", min: 680, max: 739}
      - {label: "740-779", min: 740, max: 779}
      - {label: "780+",    min: 780}
    ltv:
      - {label: "<=60",    max: 60}
      - {label: "61-80",   min: 61, max: 80}
      - {label: "81-90",   min: 81, max: 90}
      - {label: "91-95",   min: 91, max: 95}
      - {label: "96-100",  min: 96, max: 100}
      - {label: ">100",    min: 101}          # gần như chỉ HARP
    dti:
      - {label: "<=36",    max: 36}
      - {label: "37-43",   min: 37, max: 43}
      - {label: "44-50",   min: 44, max: 50}
      - {label: ">50",     min: 51}
  alerts:
    # Tháng báo cáo so với trung bình của 12 tháng ngay trước nó.
    baseline_trailing_months: 12
    amber_relative_increase: 0.20
    red_relative_increase: 0.50
    # Chỉ số danh mục (portfolio_monthly) và roll rate (roll_rates); worse = chiều xấu đi.
    metrics:
      - {name: dpd30plus_rate_count,      worse: higher}
      - {name: dpd30plus_rate_upb,        worse: higher}
      - {name: dpd90plus_rate_count,      worse: higher}
      - {name: dpd90plus_rate_upb,        worse: higher}
      - {name: new_default_rate_count,    worse: higher}
      - {name: new_default_rate_upb,      worse: higher}
      - {name: current_to_dpd30_count,    worse: higher}
      - {name: dpd30_to_dpd60_count,      worse: higher}
      - {name: dpd60_to_dpd90plus_count,  worse: higher}
      - {name: dpd30_to_current_count,    worse: lower}
    # Tỷ lệ 90+ (số khoản) của từng nhóm so với tỷ lệ gộp 12 tháng trước của chính nhóm đó.
    segments:
      dimensions: [fico_band, ltv_band, dti_band, property_state, channel]
      min_loans: 2000                 # nhóm nhỏ hơn: quá nhiễu để cảnh báo, vẫn hiện trong bảng
    # PSI cơ cấu dư nợ so với 12 tháng trước; ngưỡng ở definitions.metric_thresholds.psi.
    mix_psi:
      exclude_dimensions: [vintage]   # cơ cấu lứa đổi theo thiết kế mẫu (50k khoản mới mỗi năm)
    # Chất lượng lứa mới: default cộng dồn (số khoản) của lứa gần nhất đã đạt MOB k
    # so với trung bình các lứa chuẩn ở cùng MOB.
    new_vintage:
      mobs: [12, 24]
      benchmark_vintages: [2012, 2013, 2014, 2015, 2016]
  report:
    limitations:
      - "Freddie Mac sample dataset: 50,000 khoản ngẫu nhiên mỗi lứa, không phải toàn bộ danh mục; cơ cấu theo lứa đổi theo thiết kế mẫu chứ không theo chính sách cho vay."
      - "SMM / CPR chỉ tính khoản trả hết nợ; dữ liệu không có trả trước một phần, nên đây là cận dưới của SMM thường dùng."
      - "Vintage curve chỉ gồm khoản có lịch sử từ đầu (dòng đầu loan_age <= 1); khoản bị cắt trái không vào curve. Curve dừng ở MOB mà min_reach_share của pool đã có thể đạt tới."
      - "2020-03 → 2021-12 là giai đoạn COVID (stress segment): forbearance làm tỷ lệ quá hạn tăng không phản ánh rủi ro thông thường; mốc so sánh 12 tháng trượt không còn chạm giai đoạn này từ 2023-01."
      - "Cảnh báo so với trung bình 12 tháng trước là tín hiệu tương đối: một danh mục xấu đi chậm và đều sẽ không bị cảnh báo theo cách này. Vintage curve và so sánh theo giai đoạn bổ sung góc nhìn dài hạn."
      - "Mã trạng thái XX (không rõ) không được đoán: khoản đó nằm ngoài mẫu số của tỷ lệ quá hạn trong tháng."

ews:
  # Split theo observation month t. Cuối mỗi đoạn lùi 3 tháng để cửa sổ nhãn
  # t+1..t+3 không chạm sang đoạn kế tiếp.
  time_split:
    train:       {start: "2014-01", end: "2018-09"}
    validation:  {start: "2019-01", end: "2019-09"}
    stress_test: {start: "2020-03", end: "2021-09"}   # covid_period
    out_of_time: {start: "2022-01", end: null}        # null = tháng cuối còn đủ t+3
  # Quy tắc gán nhãn và loại trừ nằm trong credit_risk.ews.labels, có unit test.
  cohort_exclusions:
    - inactive_at_t                  # đã zero balance tại t hoặc trước t
    - already_90plus_at_t            # đã xấu sẵn, không phải "sắp xấu"
    - status_not_available_at_t      # mã XX: không biết trạng thái tại t
    - incomplete_performance_window  # thiếu tháng, exit không rõ kết cục, hoặc hết dữ liệu trước t+3
  # Số khoản lấy mẫu (seed ở đầu file) để đối chiếu nhãn SQL trên toàn panel với labels.py (pandas).
  reference_sample_loans: 20000
  # Tháng chấm điểm watchlist; null = tháng mới nhất có trong dữ liệu (chưa có nhãn).
  scoring_month: null
  # Quyết định 2026-10-25 (chặng 9): train giữ mọi event và một mẫu ngẫu nhiên non-event,
  # mỗi non-event mang trọng số 1 / non_event_rate để PD không bị lệch lên.
  # Validation / stress / out-of-time được chấm điểm đầy đủ.
  train_sample:
    non_event_rate: 0.05
  # Feature tại tháng t, chỉ từ các dòng <= t (lịch sử tối đa definitions.windows.observation_months).
  # Cột gốc mà feature đọc phải có use: true trong feature_availability.yaml (freddie_mac).
  # Quyết định 2026-10-25: dùng cả cờ hỗ trợ của servicer (forbearance, deferral, modification).
  features:
    numeric:
      # lúc giải ngân
      - fico
      - orig_ltv
      - orig_cltv
      - orig_dti
      - orig_interest_rate
      - orig_upb
      - orig_loan_term
      - mi_pct
      - num_borrowers
      - num_units
      # hành vi tại t và trong cửa sổ quan sát
      - mob
      - bucket_num               # 0 current, 1 dpd30, 2 dpd60 (90+ tại t đã bị loại khỏi cohort)
      - bucket_change_1m         # bucket_num(t) - bucket_num(t-1); 0 khi không có tháng trước
      - months_30plus_window     # số tháng 30+ trong cửa sổ
      - max_bucket_window
      - months_since_delinquent  # từ lần 30+ gần nhất trong toàn lịch sử; 999 = chưa từng
      - ever_90plus_before_t
      - history_months_window    # số tháng có dữ liệu trong cửa sổ
      - upb_ratio                # current_upb / orig_upb
      - paydown_window           # (upb đầu cửa sổ - upb tại t) / orig_upb
      - rate_change              # current_interest_rate - orig_interest_rate
      - non_interest_bearing_share
      - assistance_months_window
      - modified
      - payment_deferral
      - disaster
    categorical:
      - occupancy_status
      - loan_purpose
      - channel
      - property_type
      - first_time_homebuyer
      - harp_indicator
      - property_state
      - assistance_plan_at_t     # F forbearance, R repayment, T trial, none
    categorical_min_share: 0.001  # mức hiếm hơn gộp vào "other" (đếm trên mẫu train)
  models:
    baseline:                    # logistic regression trên feature chuẩn hoá + one-hot
      C: 1.0
      max_iter: 2000
    challenger:                  # LightGBM; chọn cấu hình theo selection_metric trên validation
      n_estimators: 2000
      early_stopping_rounds: 100
      grid:
        - {num_leaves: 15, learning_rate: 0.05, min_child_samples: 200, reg_lambda: 1.0}
        - {num_leaves: 31, learning_rate: 0.05, min_child_samples: 200, reg_lambda: 1.0}
        - {num_leaves: 63, learning_rate: 0.03, min_child_samples: 500, reg_lambda: 5.0}
      common: {subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8}
    # Mô hình cho watchlist: mô hình có selection_metric trên validation cao hơn.
    selection_metric: pr_auc
  # Quyết định 2026-10-25: không hiệu chỉnh lại mức PD; báo cáo calibration riêng từng đoạn.
  # Phân khúc đánh giá trong từng đoạn validation / stress / out-of-time.
  segments: [bucket_at_t, fico_band, ltv_band, vintage_year]
  baseline_model: logistic_regression
  challenger_model: lightgbm
  # capture / precision / lift ở top k%: xếp hạng trong từng tháng, như watchlist (top 5% = capacity_share).
  evaluation_metrics: [pr_auc, roc_auc, capture_top_5pct, precision_top_5pct, lift_top_5pct, capture_top_10pct, brier]
  alert:
    method: capacity
    capacity_share: 0.05   # đội vận hành xử lý được 5% khoản vay mỗi tháng
    reason_codes: 3        # số yếu tố đóng góp lớn nhất ghi cạnh mỗi khoản trong watchlist
  # Quyết định 2026-10-25: survival mô tả, tự viết (numpy). Thời gian = MOB; khoản bị cắt trái
  # vào risk set từ MOB đầu tiên có dữ liệu (delayed entry). Prepayment là competing risk:
  # Kaplan-Meier coi payoff là censored (cause-specific), Aalen-Johansen ước lượng
  # cumulative incidence của default và payoff cùng lúc. other_exit và còn hoạt động = censored.
  survival:
    groups: [vintage_year, fico_band, ltv_band]
    checkpoints: [12, 24, 36, 60]
    min_at_risk: 500           # curve một nhóm dừng khi risk set nhỏ hơn mức này
  report:
    limitations:
      - "Nhãn: lần đầu vào 90+ DPD (gồm RA) hoặc thanh lý trong t+1..t+3; khoản đã 90+, đã thoát, hoặc trạng thái XX tại t không thuộc cohort; cửa sổ thiếu tháng hoặc kết thúc bằng exit không rõ kết cục bị loại."
      - "Split theo tháng quan sát, mỗi đoạn lùi 3 tháng để cửa sổ nhãn không chạm đoạn sau. Cùng một khoản vay có thể có mặt ở nhiều đoạn (ở các tháng khác nhau): đây là out-of-time theo thời gian, không phải theo khoản vay."
      - "Train chỉ gồm 2014-01 → 2018-09; 2020-03 → 2021-09 (COVID) là stress test, không train. Tỷ lệ sự kiện đổi mạnh giữa các đoạn (khoảng 0.12% train, 0.9% stress, 0.25% out-of-time) và cơ cấu cohort cũng đổi, nên mức PD tuyệt đối không khớp thực tế ở mọi đoạn (xem Calibration). PD không được hiệu chỉnh lại; watchlist xếp hạng theo điểm nên không phụ thuộc mức PD."
      - "Cờ payment deferral gần như chỉ xuất hiện từ 2020 (chương trình COVID), forbearance và modification hiếm trong train: mô hình học rất ít từ các cờ này dù chúng có mặt."
      - "Không có biến kinh tế vĩ mô (lãi suất thị trường, giá nhà, thất nghiệp): thay đổi môi trường chỉ được phản ánh gián tiếp qua hành vi trả nợ."
      - "Survival là mô tả (Kaplan-Meier, Aalen-Johansen), không có covariate; giả định censoring không mang thông tin, và khoản other_exit bị coi là censored."
