# MODULE 2 — Independent Model Validation
# Nguyên tắc: đọc model package đã đóng băng, tự tính lại mọi chỉ số từ đầu.
# Code metric nằm ở credit_risk.validation (numpy thuần), độc lập với sklearn
# mà Module 1 dùng lúc phát triển.

seed: 2026   # khác seed phát triển một cách có chủ đích

population_reconciliation:
  abs_tolerance_rows: 0         # số dòng phải khớp chính xác với model card
  abs_tolerance_bad_rate: 1.0e-6

discrimination:
  metrics: [auc, gini, ks]
  samples: [train, test]

calibration:
  n_bins: 10
  metrics: [brier, calibration_slope, calibration_intercept]

stability:
  psi_n_bins: 10
  # ngưỡng: definitions.metric_thresholds.psi
  top_features_for_psi: 5

uncertainty:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  method: percentile
  stratified: true

segments:
  - {name: score_band, column: score_band}
  - {name: contract_type, column: NAME_CONTRACT_TYPE}
  - {name: ext_source_missing_pattern, column: ext_source_missing_pattern}
  # Thuộc tính nhạy cảm được giữ trong scorecard (PROJECT_SCOPE #7): bắt buộc báo cáo
  # AUC, calibration và tỷ lệ bị từ chối theo từng nhóm.
  - {name: gender, column: CODE_GENDER, fairness_review: true}
  - {name: family_status, column: NAME_FAMILY_STATUS, fairness_review: true}
  - {name: age_band, column: DAYS_BIRTH, fairness_review: true}

# Quyết định 2026-10-24 (chặng 6.7): thẩm định cả hai mô hình; dải tuổi và quy tắc từ chối dưới đây.
segment_options:
  samples: [test]                 # tập chính để xem theo phân khúc (validation chỉ để tham khảo)
  min_group_size: 500             # nhóm nhỏ hơn: vẫn báo n và bad rate, không tính AUC
  score_bands: 10                 # band điểm champion, biên học trên train (equal-count)
  age_bands_years: [30, 45, 60]   # DAYS_BIRTH -> <30, 30-45, 45-60, 60+
  reject_rule:
    pd_above: 0.10                # "từ chối" = PD đã calibrate > 10%, dùng chung cho hai mô hình
  band_z_limit: 2.0               # |z| của bad quan sát so kỳ vọng trong nhóm, vượt thì gắn cờ

implementation_check:
  sample_size: 5000
  abs_tolerance_pd: 1.0e-9

# Quy tắc ra kết luận (chặng 7.1, quyết định 2026-10-25). Mỗi quy tắc đọc metrics.json của bước
# validate-model và cho một trong ba kết quả cho TỪNG mô hình: pass / note (Đạt có lưu ý) / remediate
# (Phải khắc phục). Kết luận mô hình = kết quả nặng nhất. Khuyến nghị tổng do quy tắc sinh ra, không viết tay.
conclusion_rules:
  headline_sample: test
  recommendation: true                 # thêm mục "triển khai mô hình nào, giữ mô hình nào làm đối chứng"
  rules:
    blocking_checks: {}                # gói / dân số / chấm lại lệch -> remediate, không có ngưỡng
    auc_ci_lower:                      # biên dưới khoảng 95% của AUC trên test
      remediate_below: 0.70
      note_below: 0.72
    validation_test_gap:               # tụt từ validation sang test có ý nghĩa thống kê
      metric: gini
      note_if_ci_excludes_zero: true
    slope:                             # slope hiệu chỉnh trên test
      note_outside: [0.90, 1.10]
      note_z_above: 3.0
      remediate_outside: [0.80, 1.20]
    bad_rate_to_pd_ratio:
      note_outside: [0.95, 1.05]
    flagged_bands:
      note_at_least: 3
    output_psi:                        # score / PD tổng thể so với application_test
      remediate_light: red
      note_light: amber
    feature_psi:                       # biến top-5
      note_light: red
    sensitive_calibration:             # nhóm nhạy cảm bị cờ hiệu chỉnh (|z| > band_z_limit)
      min_group_size: 500
    adverse_impact_ratio:
      note_below: 0.80
      remediate_below: 0.60
    group_auc_gap:                     # AUC nhóm nhạy cảm thấp hơn tổng thể quá ngưỡng
      note_below_minus: 0.05

# Báo cáo thẩm định (chặng 7.3): phần "Phạm vi và giới hạn" in nguyên văn các dòng dưới đây,
# rồi thêm những giới hạn engine tự phát hiện trong lần chạy (phân khúc không tính được...).
report:
  limitations:
    - "Không có out-of-time: Home Credit không có ngày nộp đơn, nên train / validation / calibration / test là mẫu ngẫu nhiên phân tầng cùng kỳ (60/10/15/15). Hiệu năng trên test là hiệu năng cùng kỳ, không phải hiệu năng tương lai; độ ổn định theo thời gian chỉ đo được trên Freddie Mac (chặng 8-9)."
    - "application_test không có TARGET: trên dân số mới chỉ đo được PSI, không đo được sức phân biệt hay hiệu chỉnh."
    - "application_test có cơ cấu sản phẩm khác train (Revolving loans 0.9% so với 9.5%), nên PSI được tách theo NAME_CONTRACT_TYPE; một phần PSI tổng thể là do khác biệt cơ cấu này, không phải do hành vi khách hàng thay đổi."
    - "Khoảng tin cậy bootstrap là percentile đơn giản; các so sánh theo nhóm nhạy cảm chưa hiệu chỉnh đa so sánh, nên một vài cờ công bằng có thể là nhiễu mẫu."
    - "CODE_GENDER, NAME_FAMILY_STATUS và DAYS_BIRTH được giữ trong scorecard theo tiêu chí thống kê (PROJECT_SCOPE #7). Mô hình không phù hợp để dùng thật ở nơi luật cấm các thuộc tính này, bất kể kết luận bên trên."
    - "Tỷ lệ duyệt / từ chối trong phần công bằng và phần so sánh dùng một quy tắc chung (PD đã calibrate > segment_options.reject_rule.pd_above), không phải chính sách duyệt thật."
