# MODULE 2 — Independent Model Validation
# Nguyên tắc: đọc model package đã đóng băng, tự tính lại mọi chỉ số từ đầu.
# Code metric nằm ở credit_risk.validation (numpy thuần), độc lập với sklearn
# mà Module 1 dùng lúc phát triển.

seed: 2026   # khác seed phát triển một cách có chủ đích

population_reconciliation:
  abs_tolerance_rows: 0         # số dòng phải khớp chính xác với model card
  abs_tolerance_bad_rate: 1.0e-6

discrimination:
  metrics: [auc, gini, ks]
  samples: [train, test]

calibration:
  n_bins: 10
  metrics: [brier, calibration_slope, calibration_intercept]

stability:
  psi_n_bins: 10
  # ngưỡng: definitions.metric_thresholds.psi
  top_features_for_psi: 5

uncertainty:
  bootstrap_resamples: 1000
  confidence_level: 0.95
  method: percentile
  stratified: true

segments:
  - {name: score_band, column: score_band}
  - {name: contract_type, column: NAME_CONTRACT_TYPE}
  - {name: ext_source_missing_pattern, column: ext_source_missing_pattern}
  # Thuộc tính nhạy cảm được giữ trong scorecard (PROJECT_SCOPE #7): bắt buộc báo cáo
  # AUC, calibration và tỷ lệ bị từ chối theo từng nhóm.
  - {name: gender, column: CODE_GENDER, fairness_review: true}
  - {name: family_status, column: NAME_FAMILY_STATUS, fairness_review: true}
  - {name: age_band, column: DAYS_BIRTH, fairness_review: true}

# Quyết định 2026-10-24 (chặng 6.7): thẩm định cả hai mô hình; dải tuổi và quy tắc từ chối dưới đây.
segment_options:
  samples: [test]                 # tập chính để xem theo phân khúc (validation chỉ để tham khảo)
  min_group_size: 500             # nhóm nhỏ hơn: vẫn báo n và bad rate, không tính AUC
  score_bands: 10                 # band điểm champion, biên học trên train (equal-count)
  age_bands_years: [30, 45, 60]   # DAYS_BIRTH -> <30, 30-45, 45-60, 60+
  reject_rule:
    pd_above: 0.10                # "từ chối" = PD đã calibrate > 10%, dùng chung cho hai mô hình
  band_z_limit: 2.0               # |z| của bad quan sát so kỳ vọng trong nhóm, vượt thì gắn cờ

implementation_check:
  sample_size: 5000
  abs_tolerance_pd: 1.0e-9

# Quy tắc ra kết luận (Đạt / Đạt có lưu ý / Phải khắc phục): chặng 7
conclusion_rules: {}
