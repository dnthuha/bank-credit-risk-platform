[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit risk model lifecycle platform: development, independent validation, portfolio monitoring and early warning."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Khoảng phiên bản tương thích; bản ghim chính xác nằm trong requirements.txt.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Cài khi tới chặng tương ứng, rồi ghim lại vào requirements.txt.
modeling = ["lightgbm>=4.5", "shap>=0.46", "matplotlib>=3.8"]  # chặng 3-5
ews = ["lifelines>=0.29"]                                       # chặng 9
app = ["streamlit>=1.40"]                                       # chặng 10

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
